media:
  input: src/assets/uploads
  # Relative to src/content/pages/ — Astro resolves this for image optimisation
  output: ../../assets/uploads

components:
  image_with_alt:
    type: object
    fields:
      - { name: src, label: Image, type: image }
      - { name: alt, label: Alt text, type: string }
  seo:
    type: object
    label: SEO & social sharing
    fields:
      - name: title
        label: "SEO title"
        description: "Recommended under 60 characters"
        type: string
      - name: description
        label: "Meta description"
        description: "Recommended 150-160 characters"
        type: text
      - name: image
        label: "Social share image"
        description: "recommended: 1200×630px"
        type: image
  sections: 
    label: Page sections
    type: block
    list: 
      collapsible:
        collapsed: true
        summary: "{type}"
    blockKey: type
    blocks:
      - name: imageHeroBlock
        label: Image Hero
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: subtitle, label: Subtitle, type: string }
          - { name: image, label: Image, type: image, required: true }
          - { name: imageAlt, label: Image alt text, type: string }
          - { name: minHeight, label: Min height (e.g. 28rem), type: string }
          - name: colorScheme
            label: Colour scheme
            type: select
            options:
              values: ["light", "dark"]
      - name: headingBlock
        label: Heading Block
        fields:
          - { name: heading, label: Heading, type: string }
          - { name: subtitle, label: Subtitle, type: string }
          - { name: id, label: Anchor ID, type: string }
          - name: pt
            label: Padding top
            type: select
            options:
              values: ["none", "sm", "md", "lg", "xl", "2xl"]
          - name: pb
            label: Padding bottom
            type: select
            options:
              values: ["none", "sm", "md", "lg", "xl", "2xl"]
      - name: videoHeroBlock
        label: Video Hero
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: src, label: YouTube URL, type: string, required: true }
          - { name: poster, label: Poster image, type: image }
      - name: contactBlock
        label: Contact
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: subtitle, label: Subtitle, type: string }
      - name: leadBlock
        label: Lead Block
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Body, type: rich-text }
      - name: textBlock
        label: Text Block
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Body, type: rich-text }
      - name: clientLogosBlock
        label: Client Logos
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: subtitle, label: Subtitle, type: string }
      - name: serviceCardsBlock
        label: Service Cards
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: subtitle, label: Subtitle, type: string }
      - name: caseStudyGridBlock
        label: Case Study Grid
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: subtitle, label: Subtitle, type: string }
          - name: order
            label: Case studies (drag to reorder; unselected appear after, alphabetically)
            type: reference
            list: true
            options:
              collection: case_studies
              value: "{fields.uuid}"
              search: title
              label: "{fields.title}"
      - name: galleryBlock
        label: Gallery
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: heading, label: Heading, type: string }
          - name: images
            label: Images
            component: image_with_alt
            list: true
      - name: mediaTextBlock
        label: Media + Text
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Body, type: rich-text }
          - name: image
            label: Image
            component: image_with_alt
          - name: mediaSide
            label: Media side
            type: select
            options:
              values: ["left", "right"]
          - name: padding
            label: Padding
            type: select
            options:
              values: ["none", "sm", "md", "lg", "xl", "2xl"]
          - name: fixedRatio
            label: Image ratio (e.g. 4/3, 16/9)
            type: string
          - name: cta
            label: CTA
            type: object
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: URL, type: string }
      - name: tileGridBlock
        label: Tile Grid
        fields:
          - { name: id, label: Anchor ID, type: string }
          - name: columns
            label: Columns
            type: select
            options:
              values: ["2", "3"]
          - name: items
            label: Tiles
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - { name: image, label: Image, type: image }
              - { name: imageAlt, label: Image alt text, type: string }
              - { name: href, label: Link URL, type: string }
              - { name: cta, label: CTA label, type: string }
      - name: textGridBlock
        label: Text Grid
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: subtitle, label: Subtitle, type: string }
          - name: items
            label: Items
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - { name: body, label: Body, type: rich-text }
      - name: mediaBlock
        label: Media
        fields:
          - { name: id, label: Anchor ID, type: string }
          - name: mediaType
            label: Media type
            type: select
            options:
              values: ["image", "video"]
          - { name: image, label: Image, type: image }
          - { name: imageAlt, label: Image alt text, type: string }
          - { name: youtubeUrl, label: YouTube URL, type: string }
          - { name: caption, label: Caption, type: string }
          - name: width
            label: Width
            type: select
            options:
              values: ["full", "wide", "default", "narrow"]
          - name: padding
            label: Padding
            type: select
            options:
              values: ["none", "sm", "md", "lg", "xl", "2xl"]
      - name: timelineBlock
        label: Timeline
        fields:
          - { name: id, label: Anchor ID, type: string }
          - name: steps
            label: Steps
            type: object
            list: true
            fields:
              - { name: title, label: Phase title, type: string }
              - { name: downtownDescription, label: Downtown description, type: string }
              - { name: youDescription, label: Your role description, type: string }
      - name: splitHeroBlock
        label: Split Hero
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Body, type: rich-text }
          - { name: image, label: Image, type: image, required: true }
          - { name: imageAlt, label: Image alt text, type: string }
          - { name: ctaLabel, label: CTA label, type: string }
          - { name: ctaHref, label: CTA URL, type: string }
      - name: heroStackedBlock
        label: Hero Stacked
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: title, label: Title, type: string }
          - { name: body, label: Body, type: rich-text }
          - { name: image, label: Image, type: image, required: true }
          - { name: imageAlt, label: Image alt text, type: string }
      - name: aboutBlock
        label: About
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Body, type: rich-text }
          - { name: image, label: Image, type: image, required: true }
          - { name: imageAlt, label: Image alt text, type: string }
      - name: featureGridBlock
        label: Feature Grid
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: subtitle, label: Subtitle, type: string }
          - name: columns
            label: Columns
            type: select
            options:
              values: ["2","3", "4"]
          - name: colorScheme
            label: Colour scheme
            type: select
            options:
              values: ["light", "dark"]
          - name: items
            label: Items
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string }
              - { name: body, label: Body, type: rich-text }
      - name: splitMediaBlock
        label: Split Media
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Body, type: rich-text }
          - { name: image, label: Image, type: image, required: true }
          - { name: imageAlt, label: Image alt text, type: string }
          - name: orientation
            label: Image side
            type: select
            options:
              values: ["left", "right"]
          - { name: hideMediaOnMobile, label: Hide media on mobile, type: boolean, default: false }
          - { name: trimTopSpace, label: Trim top space, type: boolean, default: false }
          - { name: trimBottomSpace, label: Trim bottom space, type: boolean, default: false }
          - { name: ctaLabel, label: CTA label, type: string }
          - { name: ctaHref, label: CTA URL, type: string }
      - name: featureBlock
        label: Feature
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: subheading, label: Subheading, type: string }
          - { name: body, label: Body, type: rich-text }
          - { name: image, label: Image, type: image, required: true }
          - { name: imageAlt, label: Image alt text, type: string }
          - name: orientation
            label: Image side
            type: select
            options:
              values: ["mediaLeft", "mediaRight"]
          - name: actions
            label: Actions
            type: object
            list: true
            fields:
              - { name: label, label: Label, type: string }
              - { name: href, label: URL, type: string }
      - name: contentBlock
        label: Content
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: body, label: Body, type: rich-text }
          - { name: ctaLabel, label: CTA label, type: string }
          - { name: ctaHref, label: CTA URL, type: string }
      - name: quoteFeatureBlock
        label: Quote Feature
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: quote, label: Quote, type: text, required: true }
          - { name: attribution, label: Attribution (e.g. James Horan, Canfas Gallery), type: string }
          - { name: authorName, label: "Author name (for SEO schema, e.g. James Horan)", type: string }
      - name: faqBlock
        label: FAQ
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: heading, label: Heading, type: string }
          - { name: subtitle, label: Subtitle, type: string }
          - name: items
            label: Questions & answers
            type: object
            list: true
            fields:
              - { name: question, label: Question, type: string, required: true }
              - { name: answer, label: Answer, type: rich-text, required: true }
      - name: carouselBlock
        label: Carousel
        fields:
          - { name: id, label: Anchor ID, type: string }
          - { name: eyebrow, label: Eyebrow, type: string }
          - { name: heading, label: Heading, type: string }
          - name: items
            label: Items
            type: object
            list: true
            fields:
              - { name: title, label: Title, type: string, required: true }
              - { name: url, label: Link URL, type: string, required: true }
              - { name: image, label: Image, type: image, required: true }
              - { name: imageAlt, label: Image alt text, type: string }

content:
  - name: pages
    label: Pages
    type: collection
    path: src/content/pages
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - { name: uuid, label: UUID, type: uuid, options: {editable: false, generate: false} }
      - { name: title, label: Title (Internal reference), type: string }
      - { name: description, label: Description, type: text }
      - { name: slug, label: URL slug (e.g. about or services/events), type: string }
      - name: seo
        component: seo
      - name: sections
        component: sections

  - name: redirects
    label: Redirects
    type: file
    list: true
    path: src/content/redirects.json
    format: json
    fields:
      - { name: from, label: "From (e.g. /old-path)", type: string, required: true }
      - { name: to, label: "To (e.g. /new-path or https://example.com)", type: string, required: true }
      - name: status
        label: Status code
        type: select
        required: true
        default: "301"
        options:
          values:
            - { value: "301", label: "301 Permanent" }
            - { value: "302", label: "302 Temporary" }

  - name: site_settings
    label: Site Settings
    type: collection
    path: src/content/settings
    format: yaml-frontmatter
    filename: site.md
    view:
      primary: siteName
    fields:
      - { name: siteName, label: Site name, type: string }
      - { name: tagline, label: Tagline, type: string }
      - { name: defaultMetaTitle, label: Default meta title, type: string }
      - { name: defaultMetaDescription, label: Default meta description, type: text }
      - { name: defaultOgImage, label: Default OG image (absolute URL or /path), type: string }
      - { name: logoUrl, label: Logo URL (absolute), type: string }
      - name: availability
        label: Availability
        description: "Controls the site-wide 'not accepting new work' mode. Untick to return to business as usual."
        type: object
        fields:
          - { name: closed, label: Not accepting new work, type: boolean, default: false }
          - { name: bannerText, label: Banner text, type: string }
          - { name: reviewDate, label: "Reviewing again (e.g. early 2027) — optional", type: string }
          - { name: ctaLabel, label: Replacement CTA label (site-wide), type: string }
          - { name: ctaHref, label: Replacement CTA link, type: string }
          - { name: heading, label: Contact page heading, type: string }
          - { name: body, label: Contact page explanation, type: rich-text }
          - { name: formNotice, label: Note shown above the form, type: string }
          - { name: submitLabel, label: Submit button label, type: string }
      - name: organization
        label: Organisation
        type: object
        fields:
          - { name: legalName, label: Legal/Brand name, type: string }
          - { name: founderName, label: Founder name, type: string }
          - { name: founderJobTitle, label: Founder job title, type: string }
          - { name: addressLocality, label: "City (e.g. London)", type: string }
          - { name: addressCountry, label: "ISO country code (e.g. GB)", type: string }
          - { name: areaServed, label: "Area served (e.g. Worldwide)", type: string }
      - name: sameAs
        label: Social/profile links (sameAs)
        type: object
        list: true
        fields:
          - { name: url, label: URL, type: string }
      - name: knowsAbout
        label: Topical authority keywords
        type: object
        list: true
        fields:
          - { name: term, label: Term, type: string }

  - name: services
    label: Services
    type: collection
    path: src/content/services
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - { name: uuid, label: UUID, type: uuid, options: {editable: false, generate: false} }
      - { name: title, label: Title, type: string, required: true }
      - { name: slug, label: URL slug (under /services/), type: string }
      - { name: description, label: Short description (cards + OfferCatalog), type: text }
      - { name: longDescription, label: Long description (service page body), type: rich-text }
      - { name: serviceType, label: "Service type (e.g. SEO consulting)", type: string }
      - { name: order, label: Sort order, type: number, default: 99 }
      - { name: linkedPageSlug, label: "Linked page slug (e.g. artlogic/seo) if a marketing page already exists", type: string }
      - { name: cta, label: CTA label (for service cards), type: string }
      - { name: icon, label: Icon image, type: image }
      - name: deliverables
        label: Deliverables
        type: object
        list: true
        fields:
          - { name: item, label: Item, type: string }
      - name: faq
        label: Service-level FAQs
        type: object
        list: true
        fields:
          - { name: question, label: Question, type: string }
          - { name: answer, label: Answer, type: text }
      - name: seo
        component: seo

  - name: case_studies
    label: Case Studies
    type: collection
    path: src/content/caseStudies
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
    fields:
      - { name: uuid, label: UUID, type: uuid, options: {editable: false, generate: false} }
      - { name: title, label: Title, type: string, required: true }
      - name: client
        label: Client
        type: reference
        options:
          collection: clients
          value: "{fields.name}"
          search: name
          label: "{fields.name}"
      - name: featuredImage
        label: Featured image
        component: image_with_alt
        required: true
      - { name: excerpt, label: Excerpt (shown on index tile), type: text }
      - name: seo
        label: SEO & social sharing
        component: seo
      - name: gallery
        label: Image gallery
        component: image_with_alt
        list: true
      - name: body
        label: Body
        type: rich-text
